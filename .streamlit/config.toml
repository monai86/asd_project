# Streamlit configuration — applied automatically when running
# `streamlit run app/dashboard.py` from the project root.

[server]
# Large audio uploads (default is 200 MB; bump for long therapy sessions).
maxUploadSize = 500
headless = true
# Keep CORS enabled when XSRF protection is enabled to avoid Streamlit
# overriding config at startup.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
# Matches the COLORS palette in app/dashboard.py
primaryColor = "#4361EE"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FC"
textColor = "#1F2937"
font = "sans serif"
