name: Test and Deploy CI/CD

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run repository and secret scans
        run: |
          python scripts/check_repo_consistency.py
          python scripts/security_scan.py

      - name: Run Python dependency audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/lingualens-app/package-lock.json

      - name: Install therapist frontend dependencies
        working-directory: apps/lingualens-app
        run: npm ci

      - name: Run therapist frontend dependency audit
        working-directory: apps/lingualens-app
        run: npm audit --audit-level=high

  test-backend:
    needs: security-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Run unit tests
        run: |
          PYTHONPATH=apps/api:src pytest -m "not audio"

      - name: Run API migration smoke check
        run: |
          PYTHONPATH=apps/api:src python scripts/check_api_migrations.py

  verify-therapist-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/lingualens-app/package-lock.json

      - name: Install Therapist App dependencies
        working-directory: apps/lingualens-app
        run: npm ci

      - name: Verify Therapist App (Vercel-compatible Next.js build)
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        working-directory: apps/lingualens-app
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      # The standard Next.js build above is the Vercel deployment contract.
      # Cloudflare staging remains an explicit, separate OpenNext path.

  ui-design-audit:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API dependencies (spawned by Playwright webServer)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/lingualens-app/package-lock.json

      - name: Install Therapist App dependencies
        working-directory: apps/lingualens-app
        run: npm ci

      - name: Install Playwright chromium
        working-directory: apps/lingualens-app
        run: npx playwright install --with-deps chromium

      - name: Run UI design audit (five surfaces, mobile + desktop)
        working-directory: apps/lingualens-app
        run: npm run audit:ui

  therapist-e2e:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API dependencies (spawned by Playwright webServer)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/lingualens-app/package-lock.json

      - name: Install Therapist App dependencies
        working-directory: apps/lingualens-app
        run: npm ci

      - name: Install Playwright chromium
        working-directory: apps/lingualens-app
        run: npx playwright install --with-deps chromium

      - name: Run therapist workflow e2e suite (fresh memory backend + dev server)
        working-directory: apps/lingualens-app
        run: npx playwright test

      - name: Run gated demo workspace e2e smoke (dedicated demo server)
        working-directory: apps/lingualens-app
        run: npx playwright test -c playwright.demo.config.ts

  therapist-benchmark:
    needs: test-backend
    runs-on: ubuntu-latest
    # Blocking performance gate: the benchmark spec asserts absolute budgets
    # (calibrated on Apple M2 reference hardware), and the baseline check
    # compares the run against the committed reference with a 2x latency
    # tolerance and absolute fps floors so shared-runner noise does not block
    # merge while real regressions still fail. Recalibrate the reference file
    # after a few green runs if the runner consistently differs.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API dependencies (spawned by Playwright webServer)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/lingualens-app/package-lock.json

      - name: Install Therapist App dependencies
        working-directory: apps/lingualens-app
        run: npm ci

      - name: Install Playwright chromium
        working-directory: apps/lingualens-app
        run: npx playwright install --with-deps chromium

      - name: Run transcript workspace performance benchmark (production build)
        working-directory: apps/lingualens-app
        run: npm run bench:transcript

      - name: Enforce benchmark baseline gate (reference + tolerance)
        working-directory: apps/lingualens-app
        run: npm run bench:check

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-benchmark
          path: apps/lingualens-app/benchmarks/results/transcript-benchmark-latest.json
          if-no-files-found: ignore

  deploy-backend:
    needs:
      - security-scan
      - test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render/Railway Deployment Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render redeployment..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          elif [ -n "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Railway redeployment..."
            curl -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}"
          else
            echo "No deployment webhooks configured. Git-based auto-deployment on Render/Railway will occur if linked directly."
          fi
